version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      dev-tools:
        dependency-type: development
    labels: [dependências]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependências]
